# CI (spec §19): Actions はフルコミット SHA でピン留めし、最小権限で実行する。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Manabi Library)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint:web

      - name: Typecheck
        run: pnpm typecheck:web

      - name: Test
        run: pnpm test:web

      - name: Build
        run: pnpm build:web

  python:
    name: Python (Manabi Core)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true

      - name: Check version consistency
        # .python-version / requires-python / Ruff target-version / ty python-version は
        # 一致していなければならない(spec §19.1)。
        run: |
          set -eu
          pyver="$(tr -d '[:space:]' < ../.python-version)"
          tag="py$(echo "$pyver" | tr -d .)"
          grep -q "requires-python = \">=${pyver}\"" pyproject.toml
          grep -q "python-version = \"${pyver}\"" pyproject.toml
          grep -q "target-version = \"${tag}\"" ruff.toml

      - name: Sync dependencies (locked)
        run: uv sync --locked --all-groups

      - name: Ruff lint
        run: uv run ruff check --config ruff.toml src tests

      - name: Ruff format check
        run: uv run ruff format --check --config ruff.toml src tests

      - name: Type check (ty)
        run: uv run ty check

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing

      - name: Schema regeneration check
        # コミット済み schemas/ がモデルから再生成した内容と一致すること(spec §9.3)
        run: uv run manabi schemas check

      - name: CLI smoke test
        run: |
          uv run manabi version
          uv run manabi doctor --json > /dev/null || test $? -eq 3
