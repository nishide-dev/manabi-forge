[project]
name = "manabi-forge"
version = "0.1.0"
description = "Curriculum-aware tools for creating reliable learning materials"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2",
  "pyyaml>=6",
  "typer>=0.12",
]

[project.scripts]
manabi = "manabi_forge.cli.main:app"

[dependency-groups]
dev = [
  "pre-commit",
  "pytest>=8",
  "pytest-cov",
  "ruff",
  "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/manabi_forge"]

[tool.ty]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.terminal]
output-format = "full"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "--strict-config",
  "--strict-markers",
  "--showlocals",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
