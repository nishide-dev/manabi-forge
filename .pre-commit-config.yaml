# リポジトリ共通のローカル品質フック(spec §9.2.4)。
# CI が正であり、フックは開発者の利便のための事前チェック。
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^web/tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-check
        args: [--fix, --config, python/ruff.toml]
      - id: ruff-format
        args: [--config, python/ruff.toml]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: [--config, .markdownlint.json]

  - repo: local
    hooks:
      - id: biome-check
        name: biome check (web)
        language: system
        files: ^web/.*\.(ts|tsx|js|jsx|json|jsonc|css)$
        entry: pnpm --dir web exec biome check --no-errors-on-unmatched
        pass_filenames: true
